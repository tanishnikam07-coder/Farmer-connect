<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Farmer Connect</title>

<style>
body {
    font-family: Arial;
    margin: 0;
    background: #e8f5e9;
    text-align: center;
}

/* Header */
header {
    background: green;
    color: white;
    padding: 15px;
    font-size: 24px;
    animation: slideDown 1s ease;
}

/* Animation */
@keyframes slideDown {
    from {transform: translateY(-50px); opacity: 0;}
    to {transform: translateY(0); opacity: 1;}
}

/* Buttons */
button {
    padding: 12px 20px;
    margin: 10px;
    border: none;
    background: green;
    color: white;
    font-size: 16px;
    border-radius: 8px;
    cursor: pointer;
}

button:hover {
    background: darkgreen;
}

/* Box */
.container {
    padding: 20px;
}

.box {
    background: white;
    padding: 15px;
    margin-top: 15px;
    border-radius: 10px;
    box-shadow: 0px 0px 10px gray;
    animation: fadeIn 1s;
}

@keyframes fadeIn {
    from {opacity: 0;}
    to {opacity: 1;}
}
</style>

</head>

<body>

<header>🌾 Farmer Connect</header>

<div class="container">

    <input type="text" id="city" placeholder="Enter City (Nashik/Pune/Mumbai)">
    <br><br>

    <button onclick="market()">Market Rates</button>
    <button onclick="weather()">Weather</button>
    <button onclick="labour()">Labour</button>

    <div id="output" class="box"></div>

</div>

<script>
function market() {
    let city = document.getElementById("city").value;

    let data = {
        "Nashik": {Wheat:2350, Onion:1900, Cotton:6400, Grapes:4500},
        "Pune": {Wheat:2400, Onion:1800, Cotton:6500, Grapes:4700},
        "Mumbai": {Wheat:2450, Onion:2000, Cotton:6600, Grapes:4800}
    };

    if(data[city]){
        let text = "<h3>Market Rates - " + city + "</h3>";
        for(let crop in data[city]){
            text += crop + ": ₹" + data[city][crop] + "<br>";
        }
        document.getElementById("output").innerHTML = text;
    } else {
        document.getElementById("output").innerHTML = "Data not available";
    }
}

    let city = document.getElementById("city").value;

    if(data[city]){
        let text = "<h3>Weather - " + city + "</h3>";
        data[city].forEach(day => {
            text += day + "<br>";
        });
        document.getElementById("output").innerHTML = text;
    } else {
        document.getElementById("output").innerHTML = "Data not available";
    }
}
