<!DOCTYPE html>
<html>
<head>
    <title>Farmer Connect</title>
    <style>
        body {
            margin: 0;
            background: #87CEEB;
            font-family: Arial;
            text-align: center;
        }

        h1 {
            background: green;
            color: white;
            padding: 15px;
        }

        .road {
            position: relative;
            width: 100%;
            height: 200px;
            background: #555;
            overflow: hidden;
        }

        .tractor {
            position: absolute;
            bottom: 20px;
            left: -200px;
            font-size: 60px;
            animation: moveTractor 6s linear infinite;
        }

        @keyframes moveTractor {
            0% { left: -200px; }
            100% { left: 100%; }
        }

        .content {
            padding: 20px;
        }

        button {
            padding: 10px 20px;
            background: green;
            color: white;
            border: none;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: darkgreen;
        }
    </style>
</head>

<body>

<h1>🚜 Farmer Connect</h1>

<div class="road">
    <div class="tractor">🚜</div>
</div>

<div class="content">
    <h2>Welcome Farmer 👨‍🌾</h2>
    <p>Check Market Rates, Weather & Labour Info</p>

    <button onclick="showMessage()">Click Me</button>

    <p id="msg"></p>
</div>

<script>
function showMessage() {
    document.getElementById("msg").innerHTML =
        "Today's Weather: Sunny ☀️ <br> Wheat Price: ₹2300 <br> Tractor Labour: ₹500/hr";
}
</script>

</body>
</html>
